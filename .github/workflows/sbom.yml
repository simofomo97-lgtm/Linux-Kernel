name: Trivy SBOM (CycloneDX)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  trivy-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          TRIVY_VERSION=v0.68.2
          wget https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz
          tar zxvf trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Generate SBOM with Trivy (CycloneDX)
        run: |
          trivy sbom \
            --format cyclonedx \
            --output sbom-trivy-cyclonedx.json \
            .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-trivy-cyclonedx
          path: sbom-trivy-cyclonedx.json

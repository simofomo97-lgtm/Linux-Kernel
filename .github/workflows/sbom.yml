name: Trivy SBOM (CycloneDX)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  trivy-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1) Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) (Optionnel) Build ou préparation du projet C
      # - name: Build project
      #   run: |
      #     make

      # 3) Générer un SBOM CycloneDX avec Trivy en mode "fs"
      - name: Generate SBOM with Trivy (CycloneDX)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom-trivy-cyclonedx.json'

      # 4) Uploader le SBOM en artifact
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json

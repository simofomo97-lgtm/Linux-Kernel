name: Trivy SBOM (CycloneDX)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  trivy-sbom:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Installer Trivy (depuis le script officiel)
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_Linux-64bit.tar.gz
          tar zxvf trivy_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      # 3) Générer le SBOM CycloneDX pour le repo
      - name: Generate SBOM with Trivy (CycloneDX)
        run: |
          trivy sbom \
            --format cyclonedx-json \
            --output sbom-trivy-cyclonedx.json \
            .

      # 4) Uploader le SBOM en artifact
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-trivy-cyclonedx
          path: sbom-trivy-cyclonedx.json
